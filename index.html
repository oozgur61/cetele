<style>

  .fh-btn { background: transparent; border: none; padding: 2px 0; color: var(--muted); font-size: 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; border-radius: 4px; }
  .fh-btn:hover { color: var(--text); border: none; }
  .fh-btn.active { color: var(--accent); }
  .fh-btn .ind { font-size: 11px; opacity: .85; }
  .fdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .colmenu { position: fixed; z-index: 60; width: 270px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .menu-item { display: block; width: 100%; text-align: left; background: transparent; border: none; padding: 8px; font-weight: 500; border-radius: 6px; }

  details > summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 15px; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 6px auto 12px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

<script>
(function(){

// ---------- utils ----------
function fmt(n){
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  return (neg?'-':'') + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function parseAmount(str){
  if (typeof str === 'number') return Math.round(str);
  if (!str) return NaN;
  const cleaned = String(str).replace(/[^\d-]/g, '');
  if (!cleaned) return NaN;
  return parseInt(cleaned, 10);
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function nowIso(){ return new Date().toISOString(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

// ---------- capabilities ----------

// ---------- Firebase (cloud sync; only when running outside Claude) ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBw_sU_uQcAqQ9MFh0TqTjOqjzx4bQQc6k",
  authDomain: "cetele-a5d42.firebaseapp.com",
  projectId: "cetele-a5d42",
  storageBucket: "cetele-a5d42.firebasestorage.app",
  messagingSenderId: "400866658436",
  appId: "1:400866658436:web:ccb102c56f464a38479ad1"
};
const FIREBASE_VERSION = '10.12.2';

function loadScript(src){
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = src; sc.async = false;
    const t = setTimeout(() => reject(new Error('timeout')), 15000);
    sc.onload = () => { clearTimeout(t); resolve(); };
    sc.onerror = () => { clearTimeout(t); reject(new Error('load failed')); };
    document.head.appendChild(sc);
  });
}
async function loadFirebase(){
  if (window.firebase && window.firebase.auth && window.firebase.firestore) return;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  await loadScript(base + 'firebase-app-compat.js');
  await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
}
function authErrorText(e){

  };
  return map[e && e.code] || ('Giriş yapılamadı' + (e && e.code ? ' (' + e.code + ')' : '') + '.');
}
function cloudErrorText(e){
  if (e && e.code === 'permission-denied') return 'Buluta kaydedilemedi: Firestore güvenlik kuralları eksik ya da hatalı.';
  return 'Buluta kaydedilemedi' + (e && e.code ? ' (' + e.code + ')' : '') + '.';
}
function makeCloudDb(fs, uid){
  const base = fs.collection('users').doc(uid);
  const clean = b => JSON.parse(JSON.stringify(b));
  return {
    doc(path){
      const [col, id] = path.split('/');
      const ref = base.collection(col).doc(id);
      return {
        get: async () => { const sn = await ref.get(); return { id, exists: sn.exists, data: () => sn.exists ? sn.data() : undefined }; },
        // not awaited: the local cache applies the write at once, the server catches up (also offline)
        set: async (body) => { ref.set(clean(body)).catch(e => { console.error(e); toast(cloudErrorText(e)); }); },
        delete: async () => { ref.delete().catch(e => { console.error(e); toast(cloudErrorText(e)); }); }
      };
    },
    collection(col){
      return { get: async () => {
        const q = await base.collection(col).get();
        const docs = q.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() }));
        return { docs, size: docs.length, empty: !docs.length };
      } };
    }
  };
}

async function startCloud(){
  renderSplash();
  try {
    await loadFirebase();
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    cloud.fs = firebase.firestore();
    try { await cloud.fs.enablePersistence({ synchronizeTabs: true }); } catch(e){ /* not critical */ }
    firebase.auth().languageCode = 'tr';
    cloud.available = true;
  } catch(e) {
    console.error(e);
    cloud.available = false;
    await loadAndRender();
    toast('Bulut bağlantısı kurulamadı, bu cihazdaki verilerle devam ediliyor.');
    return;
  }
  firebase.auth().onAuthStateChanged(async (user) => {
    cloud.user = user || null;
    state.current = null;
    if (user) {
      setGuest(false);
      isCloud = true;
      db = makeCloudDb(cloud.fs, user.uid);
      state.screen = 'app';
      try { await loadAndRender(); }
      catch(e){ console.error(e); toast(cloudErrorText(e)); state.leagues = []; recompute(); render(); }
      maybeOfferMigration(user);
    } else {
      isCloud = false;
      db = localDb;
      if (isGuest()) { state.screen = 'app'; await loadAndRender(); }
      else { state.screen = 'login'; render(); }
    }
  });
}

function makeLocalDb(){
  const KEY = 'cetele_data_v1';
  localStorage.setItem('cetele_probe', '1'); localStorage.removeItem('cetele_probe');
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } };
  const write = (o) => localStorage.setItem(KEY, JSON.stringify(o));
  const snap = (id, d) => ({ id, exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)) });
  return {
    doc(path){
      const [col, id] = path.split('/');
      return {
        get: async () => snap(id, (read()[col] || {})[id]),
        set: async (body) => { const o = read(); o[col] = o[col] || {}; o[col][id] = JSON.parse(JSON.stringify(body)); write(o); },
        delete: async () => { const o = read(); if (o[col]) delete o[col][id]; write(o); }
      };
    },
    collection(col){
      return { get: async () => { const docs = Object.entries(read()[col] || {}).map(([id, d]) => snap(id, d)); return { docs, size: docs.length, empty: !docs.length }; } };
    }
  };
}

// ---------- default league shape ----------
function newLeague(name){
  return {
    name: name || 'Yeni Lig',
    createdAt: nowIso(),
    teams: [],
    marketName: 'Computer',
    startingBudget: 100000000,
    negativeBudgetRule: 0.25, // 0.25 or 0
    zeroPointsIfNegative: true,
    pointBonusPerPoint: 10000,
    adminBonusEnabled: false,
    adminBonusTable: [],
    transfers: [],       // {id, player, amount, from, to, addedAt}
    squadValues: {},     // team -> {value, updatedAt}
    pointsLog: [],        // {id, team, mode:'weekly'|'cumulative', value, addedAt, label}
    adminBonusLog: []     // {id, ranking:[team...], label, addedAt}
  };
}

// ---------- calculation engine ----------
// Team names are matched ignoring case and extra spaces ("kara  kartal" = "Kara Kartal")
function canonName(lg, name){
  const n = normName(name);
  if (!n) return null;
  const t = (lg.teams || []).find(x => normName(x) === n);
  if (t) return t;
  const m = lg.marketName || 'Computer';
  return normName(m) === n ? m : null;
}
function unknownTransferNames(lg){
  const counts = new Map();
  (lg.transfers || []).forEach(tr => [tr.from, tr.to].forEach(nm => {
    if (canonName(lg, nm) === null) { const k = String(nm).trim(); counts.set(k, (counts.get(k) || 0) + 1); }
  }));
  return counts;
}
function computeLeague(lg){
  const teams = lg.teams || [];
  const ledger = {}; teams.forEach(t => ledger[t] = []);
  teams.forEach(t => ledger[t].push({ type: 'baslangic', label: 'Başlangıç bütçesi', amount: lg.startingBudget }));

  (lg.transfers || []).forEach(tr => {
    const to = canonName(lg, tr.to), from = canonName(lg, tr.from);
    if (to && ledger[to]) {
      ledger[to].push({ type: 'alis', label: `${tr.player} (${tr.from}'den alış)`, amount: -Math.abs(tr.amount) });
    }
    if (from && ledger[from]) {
      ledger[from].push({ type: 'satis', label: `${tr.player} (${tr.to}'a satış)`, amount: Math.abs(tr.amount) });
    }
  });

  // points, per team, processed in chronological order
  const cumByTeam = {};
  (lg.pointsLog || []).slice().sort((a,b)=> (a.addedAt||'').localeCompare(b.addedAt||'')).forEach(p => {
    if (!teams.includes(p.team)) return;
    const prior = cumByTeam[p.team] || 0;
    let credited, newCum;
    if (p.mode === 'cumulative') {
      credited = p.value - prior;
      newCum = p.value;
    } else {
      credited = p.value;
      newCum = prior + p.value;
    }
    cumByTeam[p.team] = newCum;
    const bonus = credited * (lg.pointBonusPerPoint || 10000);
    ledger[p.team].push({
      type: 'puan',
      label: `Puan bonusu — ${p.label ? p.label + ' — ' : ''}${p.value} puan (${p.mode === 'cumulative' ? 'toplam' : 'bu hafta'})`,
      amount: bonus
    });
  });

  if (lg.adminBonusEnabled) {
    (lg.adminBonusLog || []).forEach(entry => {
      (entry.ranking || []).forEach((team, idx) => {
        if (!teams.includes(team)) return;
        const amt = (lg.adminBonusTable || [])[idx];
        if (amt == null) return;
        ledger[team].push({ type: 'admin', label: `Sıralama bonusu${entry.label ? ' — ' + entry.label : ''} (${idx+1}. sıra)`, amount: amt });
      });
    });
  }

  const budgets = {};
  teams.forEach(t => {
    let running = 0;
    ledger[t].forEach(e => { running += e.amount; e.runningBalance = running; });
    budgets[t] = running;
  });

  const squadValues = {};
  teams.forEach(t => { squadValues[t] = (lg.squadValues && lg.squadValues[t] && lg.squadValues[t].value) || 0; });

  const maxBid = {};
  teams.forEach(t => { maxBid[t] = budgets[t] + squadValues[t] * (lg.negativeBudgetRule || 0); });

  return { ledger, budgets, squadValues, maxBid };
}

async function saveLeague(lg){
  if (!db) { toast('Depolama kullanılamıyor, değişiklik kaydedilemedi.'); return false; }
  const { id, ...body } = lg;
  try {

function showPrompt(message, defaultValue){
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay"></div>`);
    const modal = el(`
      <div class="modal" style="max-width:420px;">
        <h3>${escapeHtml(message)}</h3>
        <div class="field"><input id="prompt-input" value="${escapeHtml(defaultValue||'')}"></div>
        <div class="row">
          <button id="prompt-cancel" style="flex:1;">Vazgeç</button>
          <button id="prompt-ok" class="primary" style="flex:1;">Tamam</button>
        </div>
      </div>
    `);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    const input = modal.querySelector('#prompt-input');
    input.focus(); input.select();
    function done(val){ overlay.remove(); resolve(val); }
    modal.querySelector('#prompt-cancel').onclick = () => done(null);
    modal.querySelector('#prompt-ok').onclick = () => done(input.value.trim() || null);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(input.value.trim() || null); if (e.key === 'Escape') done(null); });
    overlay.onclick = (e) => { if (e.target === overlay) done(null); };
  });
}
function showConfirm(message, yesLabel, danger){
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay"></div>`);
    const modal = el(`
      <div class="modal" style="max-width:420px;">
        <h3>${escapeHtml(message)}</h3>
        <div class="row">
          <button id="confirm-no" style="flex:1;">Vazgeç</button>
          <button id="confirm-yes" class="${danger === false ? 'primary' : 'danger'}" style="flex:1;">${escapeHtml(yesLabel || 'Evet, Sil')}</button>
        </div>
      </div>
    `);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    function done(val){ overlay.remove(); resolve(val); }
    modal.querySelector('#confirm-no').onclick = () => done(false);
    modal.querySelector('#confirm-yes').onclick = () => done(true);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
  });
}

let busy = false;
function toNum(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? Math.round(v) : null;
  const n = parseAmount(v);
  return isNaN(n) ? null : n;
}
function limitFiles(files){
  const max = imgLimits && imgLimits.maxCount;
  if (max && files.length > max) { toast(`Tek seferde en fazla ${max} görsel okunabilir, ilk ${max} tanesi alındı.`); return files.slice(0, max); }
  return files;
}
function sampleErrorText(e){
  const c = e && e.code;
  const map = {
    not_granted: 'Görsel okuma için izin verilmedi.',
    images_unavailable: 'Bu görünümde görsel gönderimi desteklenmiyor.',
    image_rejected: 'Görsel kabul edilmedi (format ya da boyut).',
    rate_limited: 'Çok sık istek gönderildi, biraz bekleyip tekrar dene.',
    invalid_json: 'Görsel okunamadı, tekrar dene.',
    cancelled: 'İşlem iptal edildi.'
  };
  return map[c] || ('Görsel okunamadı (' + (c || 'bilinmeyen hata') + ').');
}
function showBusy(msg){
  const o = el(`<div class="overlay"><div class="modal" style="max-width:360px;text-align:center;">
    <div class="spinner"></div><p style="margin:0 0 6px;font-weight:600;">${escapeHtml(msg)}</p>
    <p class="small muted" style="margin:0;">Bu işlem 10–60 saniye sürebilir.</p></div></div>`);
  document.body.appendChild(o);
  return () => o.remove();
}
function filesFromClipboard(cd){
  const out = [];
  if (!cd) return out;
  if (cd.files && cd.files.length) for (const f of cd.files) if (f.type && f.type.startsWith('image/')) out.push(f);
  if (!out.length && cd.items) for (const it of cd.items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) out.push(f); }
  }
  return out;
}
function dataUrlToBlob(u){
  const [h, b] = u.split(',');
  const mime = (h.match(/data:([^;]+)/) || [])[1] || 'image/png';
  const bin = atob(b);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function imageIntake(onFiles){
  if (!sampleFn) return el(`<div class="empty">Görsel okuma bu görünümde kullanılamıyor.</div>`);
  const box = el(`<div>
    <div class="paste-zone" contenteditable="true" spellcheck="false" role="textbox" aria-label="Ekran görüntüsü yapıştırma alanı"
      data-placeholder="Ekran görüntüsünü buraya yapıştır. Bilgisayarda tıklayıp Ctrl+V (Mac: ⌘+V), telefonda uzun basıp Yapıştır. Sürükleyip bırakabilirsin de."></div>
    <div class="row"><button class="pick" style="flex:0 0 auto;">📷 Dosyadan seç</button></div>
    <input type="file" accept="image/*" multiple style="display:none;">
  </div>`);
  const zone = box.querySelector('.paste-zone');
  const input = box.querySelector('input[type=file]');
  zone.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) && e.key.length === 1) e.preventDefault();
  });
  zone.addEventListener('paste', e => {
    const files = filesFromClipboard(e.clipboardData);
    e.preventDefault();
    zone.innerHTML = '';
    if (files.length) onFiles(files);
    else toast('Panoda görsel bulunamadı. Önce ekran görüntüsünü kopyala.');
  });
  // Some mobile browsers insert the image directly instead of firing a paste with files
  zone.addEventListener('input', async () => {
    const img = zone.querySelector('img');
    const src = img && img.getAttribute('src');
    zone.innerHTML = '';
    if (!src) return;
    try {
      const blob = src.startsWith('data:') ? dataUrlToBlob(src) : await (await fetch(src)).blob();
      if (blob && blob.type.startsWith('image/')) onFiles([new File([blob], 'yapistirilan.png', { type: blob.type })]);
    } catch(err) { toast('Yapıştırılan görsel okunamadı, "Dosyadan seç" ile dene.'); }
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag');
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => f.type.startsWith('image/'));
    if (files.length) onFiles(files); else toast('Bırakılan dosya bir görsel değil.');
  });
  box.querySelector('.pick').onclick = () => input.click();
  input.onchange = () => { const files = Array.from(input.files || []); input.value = ''; if (files.length) onFiles(files); };
  return box;
}
// Paste anywhere on the page (outside the paste zone) also works on the relevant tabs
function onGlobalPaste(e){
  if (e.defaultPrevented || !state.current || !sampleFn) return;
  if (document.querySelector('.overlay')) return;
  const files = filesFromClipboard(e.clipboardData);
  if (!files.length) return;
  if (state.tab === 'transferler') { e.preventDefault(); handleScreenshotUpload(files); }
  else if (state.tab === 'puanlar') { e.preventDefault(); handleStandingsScreenshot(files, 'points'); }
  else if (state.tab === 'kadro') { e.preventDefault(); handleStandingsScreenshot(files, 'squad'); }
}

  modal.querySelector('#fb-send').onclick = async () => {
    const text = modal.querySelector('#fb-text').value.trim();
    if (!text) { toast('Mesaj boş olamaz.'); return; }
    const btn = modal.querySelector('#fb-send');
    btn.disabled = true;
    if (cloud.available) {
      cloud.fs.collection('feedback').add({

      }).catch(e => { console.error(e); toast(e && e.code === 'permission-denied' ? 'Geri bildirim gönderilemedi: Firestore kuralları güncel değil.' : 'Geri bildirim gönderilemedi, tekrar dene.'); });
      overlay.remove();
      toast('Geri bildirimin gönderildi, teşekkürler.');

    try {
      const ref = db.doc('feedback/' + uidv);
      const snap = await ref.get();

      const messages = prev.concat([{ id: uid(), cat: modal.querySelector('#fb-cat').value, text: text.slice(0, 2000), at: nowIso(), league: state.current ? state.current.name : '' }]).slice(-100);
      await ref.set({ messages, updatedAt: nowIso() });
      overlay.remove();
      toast('Geri bildirimin gönderildi, teşekkürler.');
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      toast('Gönderilemedi, tekrar dene.');

  };

function renderInbox(){

<li><strong>Puan Bonusu:</strong> Her haftanın puanlarını gir. Sadece güncel toplam puanları biliyorsan "Toplam puan" seçeneğiyle tek seferde girebilirsin.</li>
<li><strong>Sıralama Bonusu:</strong> Liginde lig yöneticisinin verdiği haftalık bonus varsa, bonus tablosunu ve geçmiş haftaların sıralamalarını gir.</li>
<li><strong>Kadro Değerleri:</strong> Tüm takımların güncel kadro değerini gir.</li>
</ol>
<p class="note"><strong>Kontrol et:</strong> Dashboard'da kendi takımının bütçesine bak ve oyundaki bütçenle karşılaştır. İkisi aynıysa kayıtların doğru demektir. Farklıysa eksik ya da iki kez girilmiş bir transfer, puan ya da bonus vardır. Aynı yöntem sonraki haftalarda da en iyi kontrol yolundur.</p>

<h2>3. Haftalık rutin</h2>
<ul>
<li><strong>Transferler oldukça:</strong> Yeni transfer haberlerini yapıştır.</li>
<li><strong>Hafta bitince:</strong> Haftanın puanlarını ve varsa sıralama bonusunu gir.</li>
<li><strong>Teklif vermeden önce:</strong> Kadro değerlerini güncelle, sonra Dashboard'da rakiplerinin maksimum teklifine bak.</li>
</ul>

<h2>4. Sekmeler</h2>
<h3>Dashboard</h3>
<p>Her takımın güncel bütçesi, kadro değeri ve maksimum teklifi. Bir takıma dokunursan sezon başından bu yana tüm bütçe hareketlerini görürsün. Eksi bütçedeki takımlar ve güncel olmayan kadro değerleri için uyarılar burada çıkar. Tüm hareketleri Excel'de açılabilen bir dosya olarak da indirebilirsin.</p>
<h3>Kadro Değerleri</h3>
<p>Takımların kadro değerlerini gir. Değerler oyunda sürekli değiştiği için teklif vermeden önce güncellemeyi alışkanlık yap.</p>
<h3>Transferler</h3>
<p>Metni yapıştırıp <strong>Metni ayrıştır</strong>'a bas. Kaydetmeden önce bir önizleme tablosu çıkar, rakamları kontrol et, gerekirse düzelt. Daha önce girilmiş bir transfer "olası mükerrer" olarak işaretlenir ve kaydedilmez.</p>
<ul>
<li>Tablodaki sütun başlıklarına dokunarak sıralayabilir ve Excel'deki gibi filtreleyebilirsin.</li>
<li>Üstteki takım düğmelerinden birini seçersen o takımın tüm alış ve satışları listelenir, toplam bedel de görünür.</li>
<li>Takım listende olmayan bir ad geçerse üstte uyarı çıkar, oradan o adı doğru takıma bağlayabilirsin.</li>
</ul>
<h3>Puan Bonusu</h3>
<p>Oyunda her puan için 10.000 bütçe eklenir. Tabloya tüm takımların puanını gir. "Bu haftanın puanı" seçersen puan toplama eklenir. "Toplam puan" seçersen sadece önceki kayıttan farkı işlenir, çift sayılmaz.</p>
<h3>Sıralama Bonusu</h3>
<p>Oyunun kuralı değildir. Bazı liglerde lig yöneticisi haftalık sıralamaya göre ek para dağıtır. Liginde böyle bir şey varsa bu sekmeyi aç, bonus tablosunu gir, her hafta takımları sürükleyerek sırala.</p>
<h3>Lig Kurulumu</h3>
<p>Takım ekleme, adını değiştirme (✎) ve silme, lig kuralları, yedekleme ve ligi silme.</p>

<h2>5. Maksimum teklif nasıl hesaplanır?</h2>
<p class="formula">Maksimum teklif = mevcut bütçe + kadro değerinin %25'i</p>
<p>Örnek: Bir takımın bütçesi 5.000.000, kadro değeri 80.000.000 ise, bu takım 5.000.000 + 20.000.000 = en fazla <strong>25.000.000</strong> teklif verebilir. Ligin "hiç eksiye düşemez" kuralını kullanıyorsa maksimum teklif sadece mevcut bütçesidir.</p>
<p><strong>Dikkat edilmesi gerekenler:</strong></p>
<ul>
<li>Rakip bir oyuncusunu <strong>başka bir takıma</strong> satarsa parası hemen gelir, maksimum teklifi o an artar. Computer'a yaptığı satışlar ise ertesi gün işlenir.</li>
<li>Kadro değerleri güncel değilse hesap da yanlış olur.</li>
</ul>

<h2>6. Önemli hatırlatmalar</h2>
<ul>
<li><strong>Eksi bütçe:</strong> Haftanın ilk maçı başladığında bütçesi eksi olan takım o hafta 0 puan alır. Dashboard'da eksi bütçedeki takımlar kırmızıyla işaretlenir.</li>
<li><strong>Yedek al:</strong> Lig Kurulumu → Yedekleme → <strong>Yedek indir</strong>. Özellikle büyük değişikliklerden önce.</li>
<li><strong>Aynı anda iki cihazda düzenleme yapma:</strong> Son kaydedilen geçerli olur, diğer cihazdaki değişiklik kaybolabilir.</li>
</ul>

<h2>7. Sık sorulan sorular</h2>
<h3>Dashboard'daki bütçem oyundakiyle tutmuyor.</h3>
<p>Eksik ya da iki kez girilmiş bir transfer, eksik haftalık puan ya da bonus olabilir. Transferler sekmesinde kendi takımını seçip listeyi oyundaki haberlerle karşılaştır.</p>
<h3>Yanlış bir transfer girdim.</h3>
<p>Transferler tablosunda satırın sonundaki ✕ ile sil, sonra doğrusunu gir.</p>
<h3>Ligdeki diğer oyuncular kayıtlarımı görebilir mi?</h3>
<p>Hayır. Kayıtların sadece senin hesabında durur.</p>
<h3>Bir oyuncu takımının adını değiştirdi.</h3>
<p>Lig Kurulumu'nda o takımın yanındaki ✎'e bas, yeni adı yaz. Geçmiş kayıtların hepsi yeni ada geçer.</p>
<h3>Uygulama açılırken şifre sormuyor.</h3>
<p>Normal. Bir cihazda bir kez giriş yaptıktan sonra, sol menüden <strong>Çıkış yap</strong> demediğin sürece oturumun açık kalır.</p>
<h3>ÇETELE şifresi Gmail şifremi değiştirir mi?</h3>
<p>Hayır. ÇETELE şifresi sadece bu uygulamaya giriş içindir. Gmail hesabın ve şifren bundan hiç etkilenmez.</p>
<h3>Bir hata buldum ya da bir önerim var.</h3>
<p>Sol menünün altındaki <strong>Geri bildirim gönder</strong>'e bas. Mesajın doğrudan geliştiriciye ulaşır.</p>
</article>`);
  return wrap;
}

  const lg = state.current;

    <div class="card">
      <h2>${escapeHtml(lg.name)}</h2>
      <div class="sub">Temel lig ayarları</div>
      <div class="grid2">
        <div class="field"><label>Lig adı</label><input id="f-name" value="${escapeHtml(lg.name)}"></div>
        <div class="field"><label>Market/Bot hesabının adı (örn. Computer)</label><input id="f-market" value="${escapeHtml(lg.marketName)}"></div>
        <div class="field"><label>Başlangıç bütçesi</label><input id="f-start" class="num" value="${lg.startingBudget}"></div>
        <div class="field">
          <label>Eksi bütçe kuralı</label>
          <select id="f-negrule">
            <option value="0.25" ${lg.negativeBudgetRule===0.25?'selected':''}>Kadro değerinin %25'ine kadar eksiye düşebilir</option>
            <option value="0" ${lg.negativeBudgetRule===0?'selected':''}>Hiç eksiye düşemez</option>
          </select>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <input type="checkbox" id="f-zeropoints" style="width:auto;" ${lg.zeroPointsIfNegative?'checked':''}>
        Haftanın ilk maçı başladığında bütçesi eksi olan takım o hafta 0 puan alır
      </label>
      <div class="helptext">Puan bonusu oyunun sabit kuralı: puan başına 10.000, bu ayarlanamaz.</div>
      <div style="margin-top:14px;"><button class="primary" id="save-basic">Kaydet</button></div>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="card">
      <h2>Takımlar</h2>
      <div class="sub">Ligdeki tüm takımların gerçek isimleri (market/bot hesabı hariç)</div>
      <div class="name-note">
        <strong>⚠ Takım adlarını oyundakiyle aynı yaz.</strong> Transferler, oyundan kopyaladığın metindeki takım adlarına göre eşleştirilir.
        En güvenlisi adları Comunio'daki sıralama ekranından <strong>kopyalayıp yapıştırmak</strong>.
        Büyük/küçük harf farkı ve fazladan boşluklar (örneğin kelimeler arasında çift boşluk) sorun olmaz. Ama yazım farkı olursa farklı takım sayılır ve o transferler bütçeye yansımaz: kelimelerin bitişik yazılması ("Kara Kartal" ile "KaraKartal") ya da bir harfin farklı olması ("Yıldız FC" ile "Yildiz FC") gibi.
        Böyle bir durumda Transferler sekmesinde uyarı çıkar. Bir oyuncu takımının adını oyunda değiştirirse buradan ✎ ile adını güncelle.
      </div>
      <div id="team-list"></div>
      <div class="row" style="margin-top:10px;">
        <input id="new-team" placeholder="Takım adı ekle...">
        <button id="add-team" style="flex:0 0 auto;">Ekle</button>
      </div>
    </div>
  `));
  const teamListEl = wrap.querySelector('#team-list');
  function renderTeamList(){
    teamListEl.innerHTML = '';
    if (!lg.teams.length) { teamListEl.appendChild(el(`<div class="empty">Henüz takım eklenmedi.</div>`)); return; }
    lg.teams.forEach((t, i) => {
      const row = el(`<div class="row" style="margin-bottom:6px;align-items:center;">
        <div style="flex:3;">${escapeHtml(t)}</div>
        <button class="icon-btn ren" style="flex:0 0 auto;" title="Adını değiştir">✎</button>
        <button class="icon-btn del" style="flex:0 0 auto;" title="Sil">✕</button>
      </div>`);
      row.querySelector('.ren').onclick = async () => {
        const nn = await showPrompt(`"${t}" için yeni ad (geçmiş kayıtlar da güncellenir):`, t);
        if (!nn || nn === t) return;
        if (lg.teams.some((x, j) => j !== i && normName(x) === normName(nn))) { toast('Bu adda bir takım zaten var.'); return; }
        renameTeam(lg, t, nn);
        await persist();
        toast(`"${t}" artık "${nn}".`);
      };
      row.querySelector('.del').onclick = async () => {
        const ok = await showConfirm(`"${t}" takımını silmek istediğine emin misin? Bu takıma ait geçmiş veriler ledger'da kalır ama hesaplamalarda görünmez.`);
        if (!ok) return;
        lg.teams.splice(i, 1);
        await persist();
      };
      teamListEl.appendChild(row);
    });
  }
  renderTeamList();
  wrap.querySelector('#add-team').onclick = async () => {
    const inp = wrap.querySelector('#new-team');
    const name = inp.value.trim();
    if (!name) return;
    if (lg.teams.includes(name)) { toast('Bu takım zaten ekli.'); return; }
    lg.teams.push(name);
    inp.value = '';
    await persist();
  };
  wrap.querySelector('#save-basic').onclick = async () => {
    lg.name = wrap.querySelector('#f-name').value.trim() || lg.name;
    lg.marketName = wrap.querySelector('#f-market').value.trim() || 'Computer';
    const sb = parseAmount(wrap.querySelector('#f-start').value);
    if (!isNaN(sb)) lg.startingBudget = sb;
    lg.negativeBudgetRule = parseFloat(wrap.querySelector('#f-negrule').value);
    lg.zeroPointsIfNegative = wrap.querySelector('#f-zeropoints').checked;
    state.leagues = await listLeagues();
    await persist();
    toast('Kaydedildi.');
  };
  wrap.appendChild(renderBackupCard());
  wrap.appendChild(renderDeleteLeagueCard(lg));
  return wrap;
}

function renameTeam(lg, oldName, newName){
  const n = normName(oldName);
  lg.teams = lg.teams.map(x => x === oldName ? newName : x);
  (lg.transfers || []).forEach(tr => {
    if (normName(tr.from) === n) tr.from = newName;
    if (normName(tr.to) === n) tr.to = newName;
  });
  (lg.pointsLog || []).forEach(p => { if (p.team === oldName) p.team = newName; });
  (lg.adminBonusLog || []).forEach(e => { e.ranking = (e.ranking || []).map(x => x === oldName ? newName : x); });
  if (lg.squadValues && lg.squadValues[oldName]) { lg.squadValues[newName] = lg.squadValues[oldName]; delete lg.squadValues[oldName]; }
  const v = state.trView;
  v.teams = v.teams.map(x => x === oldName ? newName : x);
  ['player', 'from', 'to'].forEach(c => { if (v.filters[c]) v.filters[c] = v.filters[c].map(x => x === oldName ? newName : x); });
}

function renderDeleteLeagueCard(lg){
  const card = el(`
    <div class="card danger-card">
      <h2>Ligi sil</h2>
      <div class="sub">"${escapeHtml(lg.name)}" ligi ve içindeki tüm kayıtlar (transferler, puanlar, bonuslar, kadro değerleri) kalıcı olarak silinir. Bu işlem geri alınamaz. Emin değilsen önce yedek indir.</div>
      <button class="danger del-league" style="flex:0 0 auto;">Bu ligi sil</button>
    </div>
  `);
  card.querySelector('.del-league').onclick = () => openDeleteLeagueModal(lg);
  return card;
}

function openDeleteLeagueModal(lg){
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal" style="max-width:440px;">
      <h3>"${escapeHtml(lg.name)}" silinsin mi?</h3>
      <p class="sub" style="margin-top:-6px;">Ligdeki ${(lg.transfers || []).length} transfer ve diğer tüm kayıtlar kalıcı olarak silinecek. Onaylamak için lig adını aşağıya aynen yaz.</p>
      <div class="field"><input class="confirm-name" placeholder="${escapeHtml(lg.name)}" autocomplete="off"></div>
      <div class="row">
        <button class="cancel" style="flex:1;">Vazgeç</button>
        <button class="danger go" style="flex:1;" disabled>Kalıcı olarak sil</button>
      </div>
    </div>
  `);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const input = modal.querySelector('.confirm-name');
  const go = modal.querySelector('.go');
  input.focus();
  input.oninput = () => { go.disabled = input.value.trim() !== lg.name.trim(); };
  modal.querySelector('.cancel').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  go.onclick = async () => {
    go.disabled = true;
    const ok = await deleteLeague(lg.id);
    if (!ok) { go.disabled = false; return; }
    overlay.remove();
    state.leagues = await listLeagues();
    if (state.leagues.length) {
      state.current = await loadLeague(state.leagues[0].id);
      setLastLeagueId(state.current.id);
    } else {
      state.current = null;
      try { localStorage.removeItem('kd_last_league'); } catch(e){}
    }
    state.tab = 'kurulum';
    recompute(); render();
    toast(`"${lg.name}" silindi.`);
  };
}

async function deleteLeague(id){
  if (!db) { toast('Depolama kullanılamıyor.'); return false; }
  try { await db.doc('leagues/' + id).delete(); return true; }
  catch(e){ console.error(e); toast('Lig silinemedi, tekrar dene.'); return false; }
}

function renderBackupCard(){
  const card = el(`
    <div class="card">
      <h2>Yedekleme</h2>
      <div class="sub">${isCloud
        ? 'Kayıtların hesabında saklanıyor ve giriş yaptığın tüm cihazlarda aynı görünüyor. Yine de ara sıra yedek indirmeni öneririm.'
        : isLocal
        ? 'Verilerin sadece bu cihazdaki tarayıcıda saklanıyor, kimseyle paylaşılmıyor. Tarayıcı verilerini silersen kaybolur. Düzenli yedek al; telefon ile bilgisayar arasında taşımak için de yedek dosyasını kullan ya da giriş yap.'
        : 'Tüm liglerini tek bir dosyaya yedekle ya da bir yedek dosyasını geri yükle.'}</div>
      <div class="row">
        <button class="bk-down" style="flex:0 0 auto;">Yedek indir</button>
        <button class="bk-up" style="flex:0 0 auto;">Yedekten geri yükle</button>
        <input type="file" accept=".json,application/json" style="display:none;">
      </div>
    </div>
  `);
  const fileIn = card.querySelector('input[type=file]');
  if (isCloud && localDb) {
    localLeagues().then(locals => {
      if (!locals.length) return;
      const b = el(`<button class="bk-mig" style="flex:0 0 auto;">Bu cihazdaki ${locals.length} yerel ligi hesabıma aktar</button>`);
      b.onclick = async () => {
        const ok = await showConfirm('Bu cihazda giriş yapmadan girdiğin ligler hesabına aktarılsın mı? Hesabında aynı lig varsa üzerine yazılır.', 'Aktar', false);
        if (!ok) return;
        const n = await migrateLocalToCloud();
        await loadAndRender();
        toast(`${n} lig hesabına aktarıldı.`);
      };
      card.querySelector('.row').appendChild(b);
    }).catch(() => {});
  }
  card.querySelector('.bk-down').onclick = async () => {
    if (!downloadsCap) { toast('İndirme bu görünümde desteklenmiyor.'); return; }
    const leagues = [];
    for (const l of await listLeagues()) { const full = await loadLeague(l.id); if (full) leagues.push(full); }
    const payload = { app: 'cetele', version: 1, exportedAt: nowIso(), leagues };
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    try { await downloadsCap.save({ filename: `cetele_yedek_${stamp}.json`, data: JSON.stringify(payload) }); }
    catch(e){ toast('İndirme iptal edildi veya başarısız.'); }
  };
  card.querySelector('.bk-up').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    let payload;
    try { payload = JSON.parse(await f.text()); } catch(e){ toast('Dosya okunamadı.'); return; }
    if (!payload || payload.app !== 'cetele' || !Array.isArray(payload.leagues)) { toast('Bu bir ÇETELE yedek dosyası değil.'); return; }
    const existing = new Set((await listLeagues()).map(l => l.id));
    const overwrite = payload.leagues.filter(l => existing.has(l.id)).length;
    const ok = await showConfirm(`${payload.leagues.length} lig yüklenecek${overwrite ? `, bunlardan ${overwrite} tanesi bu cihazdaki aynı ligin üzerine yazılacak` : ''}. Devam edilsin mi?`, 'Geri yükle', false);
    if (!ok) return;
    for (const l of payload.leagues) {
      if (!l || !l.id) continue;
      const { id, ...body } = l;
      await db.doc('leagues/' + id).set(body);
    }
    state.leagues = await listLeagues();
    const first = payload.leagues[0];
    if (first && first.id) { state.current = await loadLeague(first.id); setLastLeagueId(first.id); }
    recompute(); render();
    toast('Yedek geri yüklendi.');
  };
  return card;
}

  wrap.appendChild(listCard);
  renderTransferTable(listCard.querySelector('#transfer-table'));
  return wrap;
}

// ---------- transfer table: Excel-style sort & filter ----------
const TR_COLS = [
  { key: 'player', label: 'Oyuncu' },
  { key: 'from', label: 'Kimden' },
  { key: 'to', label: 'Kime' },
  { key: 'amount', label: 'Bedel', num: true },
];
let menuCleanup = null;
function closeMenu(){ if (menuCleanup) { const f = menuCleanup; menuCleanup = null; f(); } }

function applyTrView(all, v, exceptCol){
  const rows = all.filter(tr => {
    for (const col of ['player', 'from', 'to']) {
      if (col === exceptCol) continue;
      const f = v.filters[col];
      if (f && !f.includes(tr[col])) return false;
    }
    if (exceptCol !== 'amount') {
      if (v.amtMin != null && tr.amount < v.amtMin) return false;
      if (v.amtMax != null && tr.amount > v.amtMax) return false;
    }
    if (v.teams.length && !(v.teams.includes(tr.from) || v.teams.includes(tr.to))) return false;
    return true;
  });
  const dir = v.sortDir === 'asc' ? 1 : -1;
  const k = v.sortKey;
  rows.sort((a, b) => {
    if (k === 'amount') return (a.amount - b.amount) * dir;
    if (k === 'addedAt') return (a.addedAt || '').localeCompare(b.addedAt || '') * dir;
    return String(a[k]).localeCompare(String(b[k]), 'tr', { sensitivity: 'base' }) * dir
      || (b.addedAt || '').localeCompare(a.addedAt || '');
  });
  return rows;
}

function isColFiltered(v, col){
  if (col === 'amount') return v.amtMin != null || v.amtMax != null;
  return !!v.filters[col];
}

function renderTransferTable(host){
  closeMenu();
  const lg = state.current;
  const v = state.trView;
  host.innerHTML = '';
  const all = lg.transfers || [];
  if (!all.length) { host.appendChild(el(`<div class="empty">Henüz transfer kaydı yok.</div>`)); return; }

  const chips = el(`<div class="chips"><span class="small muted">Takım:</span></div>`);
  lg.teams.forEach(t => {
    const on = v.teams.includes(t);
    const b = el(`<button class="chip ${on ? 'on' : ''}" aria-pressed="${on}">${escapeHtml(t)}</button>`);
    b.onclick = () => { v.teams = on ? v.teams.filter(x => x !== t) : [...v.teams, t]; renderTransferTable(host); };
    chips.appendChild(b);
  });
  host.appendChild(chips);

  const rows = applyTrView(all, v, null);
  const total = rows.reduce((a, r) => a + r.amount, 0);
  const anyActive = v.teams.length || ['player', 'from', 'to', 'amount'].some(c => isColFiltered(v, c)) || v.sortKey !== 'addedAt';
  const summary = el(`<div class="summary-line"><span><strong style="color:var(--text);">${rows.length}</strong> / ${all.length} transfer gösteriliyor, toplam bedel <strong class="num" style="color:var(--text);">${fmt(total)} €</strong></span></div>`);
  if (anyActive) {
    const reset = el(`<button class="ghost small" style="color:var(--accent);">Filtreleri ve sıralamayı sıfırla</button>`);
    reset.onclick = () => {
      state.trView = { sortKey: 'addedAt', sortDir: 'desc', filters: { player: null, from: null, to: null }, teams: [], amtMin: null, amtMax: null };
      renderTransferTable(host);
    };
    summary.appendChild(reset);
  }
  host.appendChild(summary);

  const t = el(`<div style="overflow-x:auto;"><table class="data"><thead><tr></tr></thead><tbody></tbody></table></div>`);
  const headRow = t.querySelector('thead tr');
  TR_COLS.forEach(c => {
    const sorted = v.sortKey === c.key;
    const filtered = isColFiltered(v, c.key);
    const ind = sorted ? (v.sortDir === 'asc' ? '↑' : '↓') : '▾';
    const th = el(`<th class="${c.num ? 'amt' : ''}"><button class="fh-btn ${sorted || filtered ? 'active' : ''}" aria-haspopup="dialog">
      ${c.label}${filtered ? '<span class="fdot" title="Filtre uygulandı"></span>' : ''}<span class="ind">${ind}</span></button></th>`);
    th.querySelector('button').onclick = (e) => { e.stopPropagation(); openColumnMenu(e.currentTarget, c, host); };
    headRow.appendChild(th);
  });
  headRow.appendChild(el(`<th></th>`));

  const tbody = t.querySelector('tbody');
  if (!rows.length) tbody.appendChild(el(`<tr><td colspan="5" class="empty">Filtrelere uyan transfer yok.</td></tr>`));
  rows.forEach(tr => {
    const row = el(`<tr>
      <td>${escapeHtml(tr.player)}</td>
      <td>${escapeHtml(tr.from)}</td>
      <td>${escapeHtml(tr.to)}</td>
      <td class="amt num">${fmt(tr.amount)}</td>
      <td style="text-align:right;"><button class="icon-btn" title="Sil">✕</button></td>
    </tr>`);
    row.querySelector('button').onclick = async () => {
      const ok = await showConfirm('Bu transferi silmek istediğine emin misin?');
      if (!ok) return;
      lg.transfers = lg.transfers.filter(x => x.id !== tr.id);
      await persist();
    };
    tbody.appendChild(row);
  });
  host.appendChild(t);
}

function openColumnMenu(anchor, col, host){
  closeMenu();
  const lg = state.current;
  const v = state.trView;
  const menu = el(`<div class="colmenu" role="dialog" aria-label="${col.label} sütunu"></div>`);
  const asc = el(`<button class="menu-item">${col.num ? 'Küçükten büyüğe sırala' : 'A → Z sırala'}</button>`);
  const desc = el(`<button class="menu-item">${col.num ? 'Büyükten küçüğe sırala' : 'Z → A sırala'}</button>`);
  asc.onclick = () => { v.sortKey = col.key; v.sortDir = 'asc'; renderTransferTable(host); };
  desc.onclick = () => { v.sortKey = col.key; v.sortDir = 'desc'; renderTransferTable(host); };
  menu.append(asc, desc, el(`<div class="menu-sep"></div>`));

  let apply, clear;
  if (col.num) {
    const box = el(`<div>
      <div class="field"><label>En az</label><input class="num mn" value="${v.amtMin ?? ''}" placeholder="örn. 1.000.000"></div>
      <div class="field"><label>En çok</label><input class="num mx" value="${v.amtMax ?? ''}" placeholder="boş = sınırsız"></div>
    </div>`);
    menu.appendChild(box);
    apply = () => { v.amtMin = toNum(box.querySelector('.mn').value); v.amtMax = toNum(box.querySelector('.mx').value); renderTransferTable(host); };
    clear = () => { v.amtMin = null; v.amtMax = null; renderTransferTable(host); };
  } else {
    const base = applyTrView(lg.transfers || [], v, col.key);
    const counts = new Map();
    base.forEach(r => counts.set(r[col.key], (counts.get(r[col.key]) || 0) + 1));
    const values = [...counts.keys()].sort((a, b) => String(a).localeCompare(String(b), 'tr', { sensitivity: 'base' }));
    const sel = new Set(v.filters[col.key] ? v.filters[col.key].filter(x => counts.has(x)) : values);
    const box = el(`<div>
      <input class="search" placeholder="Ara…" style="margin-bottom:6px;">
      <label class="chk" style="font-weight:600;"><input type="checkbox" class="all"> Tümünü seç</label>
      <div class="menu-list"></div>
    </div>`);
    menu.appendChild(box);
    const list = box.querySelector('.menu-list');
    const allBox = box.querySelector('.all');
    const search = box.querySelector('.search');
    const visible = () => values.filter(x => normName(x).includes(normName(search.value)));
    function syncAll(){
      const vis = visible();
      allBox.checked = vis.length > 0 && vis.every(x => sel.has(x));
      allBox.indeterminate = !allBox.checked && vis.some(x => sel.has(x));
    }
    function drawList(){
      list.innerHTML = '';
      const vis = visible();
      if (!vis.length) list.appendChild(el(`<div class="small muted" style="padding:6px;">Sonuç yok</div>`));
      vis.forEach(x => {
        const item = el(`<label class="chk"><input type="checkbox" ${sel.has(x) ? 'checked' : ''}><span style="flex:1;">${escapeHtml(x)}</span><span class="small muted">${counts.get(x)}</span></label>`);
        item.querySelector('input').onchange = (e) => { if (e.target.checked) sel.add(x); else sel.delete(x); syncAll(); };
        list.appendChild(item);
      });
      syncAll();
    }
    search.oninput = drawList;
    allBox.onchange = () => { visible().forEach(x => allBox.checked ? sel.add(x) : sel.delete(x)); drawList(); };
    drawList();
    apply = () => {
      if (!sel.size) { toast('En az bir değer seç.'); return; }
      v.filters[col.key] = values.every(x => sel.has(x)) ? null : [...sel];
      renderTransferTable(host);
    };
    clear = () => { v.filters[col.key] = null; renderTransferTable(host); };
  }
  const actions = el(`<div class="row" style="margin-top:4px;"><button class="clr" style="flex:1;">Temizle</button><button class="primary ok" style="flex:1;">Uygula</button></div>`);
  actions.querySelector('.clr').onclick = clear;
  actions.querySelector('.ok').onclick = apply;
  menu.appendChild(actions);

  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const w = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  const top = r.bottom + 6;
  const h = menu.offsetHeight;
  menu.style.top = (top + h > window.innerHeight - 8 ? Math.max(8, r.top - h - 6) : top) + 'px';
  const first = menu.querySelector('.search') || menu.querySelector('input') || asc;
  first.focus();

  const onDown = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  const onKey = (e) => { if (e.key === 'Escape') closeMenu(); };
  const onScroll = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  setTimeout(() => {
    document.addEventListener('mousedown', onDown);
    document.addEventListener('touchstart', onDown, { passive: true });
  }, 0);
  document.addEventListener('keydown', onKey);
  window.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', closeMenu);
  menuCleanup = () => {
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('touchstart', onDown);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('scroll', onScroll, true);
    window.removeEventListener('resize', closeMenu);
    menu.remove();
  };
}

function parseTransferText(text){
  const results = [];
  if (!text) return results;
  const flat = text.replace(/\r/g,'');

  // Format A: "Player transfers for 1,234,567 from A to B."
  const reA = /([A-Za-zÇĞİÖŞÜçğıöşü0-9'’.\-\s]+?)\s+transfers\s+for\s+([\d.,]+)\s+from\s+([A-Za-zÇĞİÖŞÜçğıöşü0-9'’.\-\s]+?)\s+to\s+([A-Za-zÇĞİÖŞÜçğıöşü0-9'’.\-\s]+?)\s*[\.\n]/gi;
  let m;
  while ((m = reA.exec(flat + '\n')) !== null) {
    results.push({ player: m[1].trim(), amount: parseAmount(m[2]), from: m[3].trim(), to: m[4].trim() });
  }
  if (results.length) return results;

  // Format B (Turkish native): "Player 1.234.567 bonservis bedeli ile A'dan/A'den B'a/B'e transfer oldu."
  const reB = /([A-Za-zÇĞİÖŞÜçğıöşü0-9'’.\-\s]+?)\s+([\d.,]+)\s+bonservis bedeli ile\s+([A-Za-zÇĞİÖŞÜçğıöşü0-9\-\s]+?)['’](?:dan|den|tan|ten)\s+([A-Za-zÇĞİÖŞÜçğıöşü0-9\-\s]+?)['’](?:a|e|ya|ye)?\s*transfer oldu/gi;
  while ((m = reB.exec(flat)) !== null) {
    results.push({ player: m[1].trim(), amount: parseAmount(m[2]), from: m[3].trim(), to: m[4].trim() });
  }
  return results;
}

async function handleScreenshotUpload(files){
  if (!sampleFn) { toast('Görsel okuma bu görünümde kullanılamıyor.'); return; }
  if (busy) return;
  files = limitFiles(files);
  busy = true;
  const close = showBusy('Transfer görüntüsü okunuyor…');
  try {
    const prompt = `Bu görsel(ler), bir fantezi futbol ligi (Comunio) oyununun transfer bildirim ekranı. Görselde geçen HER transfer satırını eksiksiz çıkar.
Her satır iki formattan birinde olabilir:
1) "PlayerName transfers for 1,234,567 from A to B."
2) Türkçe: "PlayerName 1.234.567 bonservis bedeli ile A'dan B'a transfer oldu." (başında "04:33 -" gibi bir saat olabilir, onu yok say)
Yalnızca şu JSON dizisini döndür, başka metin yazma:
[{"player": "...", "amount": 1234567, "from": "...", "to": "..."}]
- amount tam sayı olmalı (nokta/virgül ayraçları kaldırılmış). Rakamları çok dikkatli oku.
- from ve to: takım/hesap adlarını Türkçe ekler olmadan, görseldeki gibi birebir yaz ("Kara Kartal'a" → "Kara Kartal").

    const data = await sampleFn.json(prompt, { images: files });
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.transfers) ? data.transfers : []);
    const parsed = arr.map(x => ({
      player: String(x.player || '').trim(),
      amount: toNum(x.amount),
      from: String(x.from || '').trim(),
      to: String(x.to || '').trim(),
    })).filter(x => x.player && x.from && x.to && x.amount != null);
    close();
    if (!parsed.length) { toast('Görselde transfer satırı bulunamadı.'); return; }
    openPreviewModal(parsed);
  } catch(e){
    console.error(e);
    close();
    toast(sampleErrorText(e));
  } finally {
    busy = false;
    close();
  }
}

Puan rozetleri:

Sadece bir rozet varsa: çerçeveliyse weekly, doluysa total. Hiç rozet yoksa ikisi de null.

function normName(s){ return String(s || '').toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim(); }
function matchTeam(lg, name){
  const n = normName(name);
  if (!n) return '';
  return lg.teams.find(t => normName(t) === n)
    || lg.teams.find(t => normName(t).includes(n) || n.includes(normName(t)))
    || '';
}
function currentCumulative(lg, team){
  let cum = 0;
  (lg.pointsLog || []).filter(p => p.team === team)
    .slice().sort((a,b) => (a.addedAt||'').localeCompare(b.addedAt||''))
    .forEach(p => { cum = p.mode === 'cumulative' ? p.value : cum + p.value; });
  return cum;
}

function openStandingsModal(rows, purpose){
  const lg = state.current;
  const isPoints = purpose === 'points';
  const hasWeekly = rows.some(r => r.weekly != null);
  const hasTotal = rows.some(r => r.total != null);
  const hasSquad = rows.some(r => r.squad != null);
  if (isPoints && !hasWeekly && !hasTotal) toast('Görselde puan rozeti okunamadı, değerleri elle girebilirsin.');
  const model = rows.map(r => ({ ...r, team: matchTeam(lg, r.src), include: true }));
  const opt = { mode: (hasWeekly || !hasTotal) ? 'weekly' : 'cumulative', label: '' };

  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal" style="max-width:780px;">
      <h3>${isPoints ? 'Puan önizlemesi' : 'Kadro değeri önizlemesi'}</h3>
      <p class="sub" style="margin-top:-8px;">Görselden okunan değerleri kontrol et, gerekirse düzelt. Eşleşmeyen takımları listeden seç.</p>
      ${isPoints ? `
        <div class="grid2">
          <div class="field"><label>Etiket (örn. "3. hafta")</label><input id="sm-label" placeholder="opsiyonel"></div>
          <div class="field"><label>Hangi puan işlensin?</label>
            <select id="sm-mode">
              <option value="weekly" ${opt.mode==='weekly'?'selected':''}>Haftalık puan (çerçeveli rozet)</option>
              <option value="cumulative" ${opt.mode==='cumulative'?'selected':''}>Toplam puan (dolu rozet), sadece fark işlenir</option>
            </select>
          </div>
        </div>
        ${hasSquad ? `<label class="chk"><input type="checkbox" id="sm-squad" checked> Kadro değerlerini de güncelle</label>` : ''}
        ${lg.adminBonusEnabled ? `<label class="chk"><input type="checkbox" id="sm-rank"> Bu sıralamayı sıralama bonusu olarak da kaydet (görseldeki sıra kullanılır)</label>` : ''}
      ` : ''}
      <div style="overflow-x:auto;margin-top:6px;">
        <table class="data preview-table">
          <thead><tr><th></th><th>Görseldeki ad</th><th>Takım</th>${isPoints ? '<th class="amt">Haftalık</th><th class="amt">Toplam</th>' : ''}<th class="amt">Kadro değeri</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button id="sm-cancel" style="flex:0 0 auto;">Vazgeç</button>
        <div style="flex:1;"></div>
        <button class="primary" id="sm-save" style="flex:0 0 auto;">Kaydet</button>
      </div>
    </div>
  `);
  const tbody = modal.querySelector('tbody');
  const pointVal = r => opt.mode === 'weekly' ? r.weekly : r.total;
  function isDup(r){
    if (!isPoints || !r.team) return false;
    const v = pointVal(r);
    if (v == null) return false;
    const log = lg.pointsLog || [];
    if (log.some(p => p.team === r.team && p.mode === opt.mode && p.value === v && (p.label || '') === opt.label)) return true;
    if (opt.mode === 'cumulative' && log.some(p => p.team === r.team) && currentCumulative(lg, r.team) === v) return true;
    return false;
  }
  function resetIncludes(){ model.forEach(r => { r.include = !!r.team && !isDup(r); }); }
  function renderRows(){
    tbody.innerHTML = '';
    model.forEach(r => {
      const dup = isDup(r);
      const tr = el(`<tr style="${dup ? 'opacity:.55;' : ''}">
        <td><input type="checkbox" class="inc" style="width:auto;" ${r.include ? 'checked' : ''}></td>
        <td>${escapeHtml(r.src)}${dup ? '<div class="small muted">⚠ olası mükerrer</div>' : ''}${!r.team ? '<div class="small muted">eşleşmedi</div>' : ''}</td>
        <td><select class="tm"><option value="">— atla —</option>${lg.teams.map(t => `<option value="${escapeHtml(t)}" ${r.team === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}</select></td>
        ${isPoints ? `<td class="amt"><input class="num wk" value="${r.weekly ?? ''}" style="text-align:right;width:70px;"></td>
        <td class="amt"><input class="num tt" value="${r.total ?? ''}" style="text-align:right;width:70px;"></td>` : ''}
        <td class="amt"><input class="num sq" value="${r.squad ?? ''}" style="text-align:right;min-width:120px;"></td>
      </tr>`);
      tr.querySelector('.inc').onchange = e => { r.include = e.target.checked; };
      tr.querySelector('.tm').onchange = e => { r.team = e.target.value; r.include = !!r.team && !isDup(r); renderRows(); };
      if (isPoints) {
        tr.querySelector('.wk').oninput = e => { r.weekly = toNum(e.target.value); };
        tr.querySelector('.tt').oninput = e => { r.total = toNum(e.target.value); };
      }
      tr.querySelector('.sq').oninput = e => { r.squad = toNum(e.target.value); };
      tbody.appendChild(tr);
    });
  }
  resetIncludes();
  renderRows();
  if (isPoints) {
    modal.querySelector('#sm-label').oninput = e => { opt.label = e.target.value.trim(); resetIncludes(); renderRows(); };
    modal.querySelector('#sm-mode').onchange = e => { opt.mode = e.target.value; resetIncludes(); renderRows(); };
  }
  modal.querySelector('#sm-cancel').onclick = () => overlay.remove();
  modal.querySelector('#sm-save').onclick = async () => {
    const chosen = model.filter(r => r.include && r.team);
    if (!chosen.length) { toast('Kaydedilecek satır seçilmedi.'); return; }
    const seen = new Set();
    for (const r of chosen) {
      if (seen.has(r.team)) { toast(`"${r.team}" birden fazla satırda seçili.`); return; }
      seen.add(r.team);
    }
    const parts = [];
    const base = Date.now();
    if (isPoints) {
      lg.pointsLog = lg.pointsLog || [];
      let n = 0;
      chosen.forEach((r, i) => {
        const v = pointVal(r);
        if (v == null) return;
        lg.pointsLog.push({ id: uid(), team: r.team, mode: opt.mode, value: v, label: opt.label, addedAt: new Date(base + i).toISOString() });
        n++;
      });
      if (n) parts.push(`${n} takımın puanı işlendi`);
    }
    const squadBox = modal.querySelector('#sm-squad');
    const doSquad = isPoints ? !!(squadBox && squadBox.checked) : true;
    if (doSquad) {
      lg.squadValues = lg.squadValues || {};
      let n = 0;
      chosen.forEach(r => { if (r.squad != null) { lg.squadValues[r.team] = { value: r.squad, updatedAt: nowIso() }; n++; } });
      if (n) parts.push(`${n} kadro değeri güncellendi`);
    }
    const rankBox = modal.querySelector('#sm-rank');
    if (rankBox && rankBox.checked) {
      const ranking = [...new Set(model.filter(r => r.team).map(r => r.team))];
      if (ranking.length !== lg.teams.length) {
        parts.push('sıralama bonusu kaydedilmedi (tüm takımlar eşleşmeli)');

        lg.adminBonusLog.push({ id: uid(), ranking, label: opt.label, addedAt: nowIso() });
        parts.push('sıralama bonusu kaydedildi');
      }
    }
    overlay.remove();
    await persist();
    toast(parts.length ? parts.join(', ') + '.' : 'Değişiklik yapılmadı.');
  };

  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

}

function isDuplicateTransfer(lg, tr){
  return (lg.transfers || []).some(x =>
    x.player.trim().toLowerCase() === tr.player.trim().toLowerCase() &&
    Math.abs(x.amount) === Math.abs(tr.amount) &&
    x.from.trim().toLowerCase() === tr.from.trim().toLowerCase() &&
    x.to.trim().toLowerCase() === tr.to.trim().toLowerCase()
  );
}

function openPreviewModal(parsedRows){
  const lg = state.current;
  const rows = parsedRows.map(r => ({ ...r, _dup: isDuplicateTransfer(lg, r), _include: !isDuplicateTransfer(lg, r) }));

      const [chk, playerI, fromI, toI, amtI] = tr.querySelectorAll('input');
      chk.onchange = () => rows[i]._include = chk.checked;
      playerI.oninput = () => rows[i].player = playerI.value;
      fromI.oninput = () => rows[i].from = fromI.value;

      [[fromI, r.from], [toI, r.to]].forEach(([inp, nm]) => {
        if (canonName(lg, nm) === null) {
          inp.style.borderColor = 'var(--danger)';
          inp.parentElement.appendChild(el(`<div class="small neg">takım listesinde yok</div>`));
        }
      });
      amtI.oninput = () => rows[i].amount = parseAmount(amtI.value);
      tr.querySelector('button').onclick = () => { rows.splice(i,1); renderRows(); };
      if (r._dup) {
        const dupTd = tr.children[1];
        dupTd.appendChild(el(`<div class="small muted">⚠ olası mükerrer</div>`));
      }
      tbody.appendChild(tr);
    });
    if (!rows.length) tbody.appendChild(el(`<tr><td colspan="6" class="empty">Satır kalmadı.</td></tr>`));
  }
  renderRows();
  modal.querySelector('#cancel-preview').onclick = () => overlay.remove();
  modal.querySelector('#confirm-preview').onclick = async () => {
    const toAdd = rows.filter(r => r._include && r.player && r.from && r.to && !isNaN(r.amount));
    if (!toAdd.length) { toast('Kaydedilecek satır seçilmedi.'); return; }
    const unknown = [...new Set(toAdd.flatMap(r => [r.from, r.to]).filter(nm => canonName(lg, nm) === null).map(nm => nm.trim()))];

      if (!ok) return;
    }
    lg.transfers = lg.transfers || [];
    const base = Date.now();
    toAdd.forEach((r, i) => {
      const from = canonName(lg, r.from) || r.from.trim();
      const to = canonName(lg, r.to) || r.to.trim();
      lg.transfers.push({ id: uid(), player: r.player.trim(), amount: Math.abs(r.amount), from, to, addedAt: new Date(base + i).toISOString() });
    });
    overlay.remove();
    await persist();
    toast(`${toAdd.length} transfer kaydedildi.`);
  };
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

        lg.pointsLog = lg.pointsLog.filter(x => x.id !== p.id);
        await persist();
      };
      tbody.appendChild(row);

    logEl.appendChild(t);

}
function computePointCredit(lg, entry){
  // recompute credited points for a single entry in its chronological context
  const sameTeam = (lg.pointsLog||[]).filter(p=>p.team===entry.team).slice().sort((a,b)=>(a.addedAt||'').localeCompare(b.addedAt||''));
  let cum = 0, credit = 0;
  for (const p of sameTeam) {
    if (p.mode === 'cumulative') { credit = p.value - cum; cum = p.value; }
    else { credit = p.value; cum += p.value; }
    if (p.id === entry.id) break;
  }
  return credit * (lg.pointBonusPerPoint || 10000);
}

  const tbody = summary.querySelector('tbody');
  const sqDate = t => { const u = lg.squadValues && lg.squadValues[t] && lg.squadValues[t].updatedAt; return u ? new Date(u).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; };
  const rows = lg.teams.map(t => ({ t, budget: c.budgets[t]||0, squad: c.squadValues[t]||0, max: c.maxBid[t]||0, updated: sqDate(t) }))
    .sort((a,b) => b.max - a.max);
  rows.forEach(r => {
    const negative = r.budget < 0;
    const tr = el(`<tr>
      <td>${escapeHtml(r.t)}</td>
      <td class="amt num ${negative?'neg':''}">${fmt(r.budget)}</td>
      <td class="amt num">${r.squad ? fmt(r.squad) : '<span class="neg small">girilmemiş</span>'}${r.updated ? `<div class="small muted">${r.updated}</div>` : ''}</td>
      <td class="amt num" style="font-weight:700;">${fmt(r.max)}</td>
      <td>${negative ? '<span class="pill warn">EKSİ BÜTÇE</span>' : ''}</td>
    </tr>`);
    tr.style.cursor = 'pointer';
    tr.onclick = () => openTeamDetail(r.t);
    tbody.appendChild(tr);
  });

  if (lg.negativeBudgetRule > 0) {
    const stamps = lg.teams.map(t => lg.squadValues && lg.squadValues[t] && lg.squadValues[t].updatedAt).filter(Boolean).sort();
    const missing = lg.teams.filter(t => !(lg.squadValues && lg.squadValues[t] && lg.squadValues[t].value));
    const oldest = stamps.length ? new Date(stamps[0]).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;
    const card = el(`<div class="card warn-card">
      <strong>⚠ Maks. teklif kadro değerine bağlı:</strong> Maksimum teklif = mevcut bütçe + kadro değerinin %25'i (takımın eksiye düşebileceği en fazla tutar). Yani sisteme işlenmiş kadro değeri doğrudan hesaba girer. Kadro değerleri oyunda sürekli değiştiği için en güncel değerler işlenmezse maksimum teklif yanlış hesaplanır.
      <div class="small" style="margin-top:6px;">${missing.length ? `Kadro değeri girilmemiş takım: <strong>${missing.map(escapeHtml).join(', ')}</strong>. ` : ''}${oldest ? `En eski güncelleme: <strong>${oldest}</strong>.` : ''}</div>
      <button class="go-squad" style="margin-top:10px;">Kadro değerlerini güncelle</button>
    </div>`);
    card.querySelector('.go-squad').onclick = () => { state.tab = 'kadro'; render(); };
    wrap.appendChild(card);
  }

  if (lg.zeroPointsIfNegative && rows.some(r => r.budget < 0)) {
    wrap.appendChild(el(`<div class="card" style="border-color:var(--danger);background:var(--danger-bg);">
      <strong style="color:var(--danger);">⚠ Uyarı:</strong> Eksi bütçedeki takım(lar), haftanın ilk maçı başladığında bütçe hâlâ eksideyse o hafta 0 puan alma riskiyle karşı karşıya.
    </div>`));
  }

  const exportCard = el(`<div class="card"><h2>Dışa Aktar</h2><div class="sub">Tüm bütçe hareketlerini CSV olarak indir.</div><button id="export-csv" ${downloadsCap?'':'disabled'}>${downloadsCap?'CSV İndir':'İndirme desteklenmiyor'}</button></div>`);
  wrap.appendChild(exportCard);
  const exportBtn = exportCard.querySelector('#export-csv');
  if (downloadsCap) exportBtn.onclick = async () => {
    let csv = 'Takim,Kategori,Aciklama,Tutar,CalismaBakiyesi\n';
    lg.teams.forEach(t => {
      (c.ledger[t]||[]).forEach(e => {
        csv += `"${t}","${e.type}","${(e.label||'').replace(/"/g,'""')}",${e.amount},${e.runningBalance}\n`;
      });
    });
    try {
      await downloadsCap.save({ filename: `${lg.name.replace(/[^a-z0-9]+/gi,'_')}_butce.csv`, data: '\ufeff' + csv });
    } catch(e){ toast('İndirme iptal edildi veya başarısız.'); }
  };

  return wrap;
}

function openTeamDetail(team){
  const lg = state.current;
  const c = state.computed;
  const overlay = el(`<div class="overlay"></div>`);
  const entries = c.ledger[team] || [];
  const modal = el(`
    <div class="modal">
      <h3>${escapeHtml(team)} — Bütçe Geçmişi</h3>
      <div style="overflow-x:auto;">
        <table class="data">
          <thead><tr><th>Kalem</th><th class="amt">Etki</th><th class="amt">Bakiye</th></tr></thead>
          <tbody>
            ${entries.map(e => `<tr>
              <td>${escapeHtml(e.label)}</td>
              <td class="amt num ${e.amount<0?'neg':'pos'}">${e.amount>=0?'+':''}${fmt(e.amount)}</td>
              <td class="amt num" style="font-weight:600;">${fmt(e.runningBalance)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <div style="flex:1;"></div>
        <button id="close-detail" class="primary" style="flex:0 0 auto;">Kapat</button>
      </div>
    </div>
  `);
  modal.querySelector('#close-detail').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

boot();
})();
</script>
</body>
</html>
